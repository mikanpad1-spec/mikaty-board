      <rect x="-27" y="20" width="54" height="17" rx="9" fill="#ffd93d" stroke="#e09f00" stroke-width="3"/>
      <rect x="-8" y="37" width="16" height="30" rx="7" fill="#8a5a2b"/>
      <circle cx="0" cy="75" r="9" fill="#ffd93d" stroke="#e09f00" stroke-width="3"/>
