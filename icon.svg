<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rr"><rect x="0" y="0" width="512" height="512" rx="96"/></clipPath>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5577dd"/><stop offset="1" stop-color="#2f459e"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#rr)">
    <rect x="0" y="0" width="512" height="512" fill="#ffd23e"/>
    <path d="M256,300 L256,-160 L486,-98 Z" fill="#ffe066"/>
    <path d="M256,300 L486,-98 L654,70 Z" fill="#ffd23e"/>
    <path d="M256,300 L654,70 L716,300 Z" fill="#ffe066"/>
    <path d="M256,300 L716,300 L654,530 Z" fill="#ffd23e"/>
    <path d="M256,300 L654,530 L486,698 Z" fill="#ffe066"/>
    <path d="M256,300 L486,698 L256,760 Z" fill="#ffd23e"/>
    <path d="M256,300 L256,760 L26,698 Z" fill="#ffe066"/>
