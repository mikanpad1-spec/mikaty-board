    <g transform="translate(252 180) rotate(-8)">
      <path d="M-54,22 L-54,-10 L-30,8 L0,-24 L30,8 L54,-10 L54,22 Q0,32 -54,22 Z" fill="url(#crownGrad)" stroke="#dd9200" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-54" cy="-14" r="9" fill="#ffe066" stroke="#dd9200" stroke-width="3"/>
      <circle cx="0" cy="-29" r="9" fill="#ffe066" stroke="#dd9200" stroke-width="3"/>
      <circle cx="54" cy="-14" r="9" fill="#ffe066" stroke="#dd9200" stroke-width="3"/>
      <path d="M0,21 C-13,9 -7,-3 0,3 C7,-3 13,9 0,21 Z" fill="#ff6b9d" stroke="#dd9200" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="-28" cy="14" r="4" fill="#7cc4ff"/>
      <circle cx="28" cy="14" r="4" fill="#7cc4ff"/>
    </g>
    <!-- sparkles -->
    <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" transform="translate(84 118)" fill="#ffffff" opacity="0.95"/>
    <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" transform="translate(430 106) scale(0.7)" fill="#ffd6e7" opacity="0.95"/>
    <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" transform="translate(442 336) scale(0.55)" fill="#ffffff" opacity="0.9"/>
    <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" transform="translate(66 356) scale(0.5)" fill="#ffffff" opacity="0.9"/>
