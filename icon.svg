    <ellipse cx="256" cy="325" rx="130" ry="120" fill="url(#bodyGrad)" stroke="#2b3a67" stroke-width="6"/>
    <!-- waving flipper -->
    <ellipse cx="386" cy="276" rx="19" ry="43" transform="rotate(-42 386 276)" fill="#3d5bb5" stroke="#2b3a67" stroke-width="5"/>
    <!-- white front -->
    <ellipse cx="256" cy="292" rx="94" ry="78" fill="#ffffff"/>
    <ellipse cx="256" cy="382" rx="82" ry="66" fill="#ffffff"/>
