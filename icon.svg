    <ellipse cx="296" cy="278" rx="13" ry="17" fill="#26304d"/>
    <circle cx="212" cy="272" r="5" fill="#ffffff"/>
    <circle cx="292" cy="272" r="5" fill="#ffffff"/>
    <circle cx="220" cy="283" r="2.5" fill="#ffffff"/>
    <circle cx="300" cy="283" r="2.5" fill="#ffffff"/>
    <!-- beak -->
    <ellipse cx="256" cy="304" rx="17" ry="11" fill="#ffb020" stroke="#e8930c" stroke-width="3"/>
    <ellipse cx="256" cy="313" rx="10" ry="6" fill="#f59e0b"/>
