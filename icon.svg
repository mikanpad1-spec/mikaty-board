    <ellipse cx="300" cy="444" rx="28" ry="13" fill="#ffb020" stroke="#d97706" stroke-width="3"/>
    <!-- bow tie -->
    <path d="M256,356 L224,338 Q214,356 224,374 Z" fill="#e63946" stroke="#b02334" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256,356 L288,338 Q298,356 288,374 Z" fill="#e63946" stroke="#b02334" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="256" cy="356" r="9" fill="#ff5d73" stroke="#b02334" stroke-width="3"/>
    <!-- cheeks -->
    <ellipse cx="192" cy="312" rx="17" ry="11" fill="#ff9eb5" opacity="0.95"/>
    <ellipse cx="320" cy="312" rx="17" ry="11" fill="#ff9eb5" opacity="0.95"/>
    <!-- eyes -->
