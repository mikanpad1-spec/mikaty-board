  var ni=(IMG[ev.id]||[]).length;
  li.appendChild(el("div","dt",md(ev.s)+"("+wd(ev.s)+") 〜 "+md(ev.e)+"("+wd(ev.e)+")・"+days+"日間"+(ni?"・画像"+ni+"枚":"")+"・"+catOf(ev)));
  if(ev.done)li.appendChild(el("span","tag","実装済み"));
  press(li,function(){openDetail(ev)});
  return li;
}
function onDay(k){return EV.filter(function(e){return matchFmt(e)&&D(e.s)<=D(k)&&D(k)<=D(e.e)})}
function renderSel(){
  var list=$("selList");list.innerHTML="";
  var evs=onDay(sel);
  $("selTitle").textContent=(sel===today?"今日 ":"")+md(sel)+"("+wd(sel)+")のイベント";
  $("selSub").textContent=evs.length?evs.length+"件":"";
  if(evs.length){evs.forEach(function(e){list.appendChild(item(e))});return}
  var nx=EV.filter(function(e){return matchFmt(e)&&D(e.s)>D(sel)}).sort(function(a,b){return D(a.s)-D(b.s)})[0];
  list.appendChild(el("div","empty","この日に開催中のイベントはありません。"));
  if(nx){list.appendChild(item(nx))}
}
function renderMonth(){
  var y=+ym.slice(0,4),m=+ym.slice(5);
  $("title").textContent=y+"年"+m+"月";
  $("jump").value=ym;
  $("prev").disabled=ym<=MIN;$("next").disabled=ym>=MAX;
  var first=Date.UTC(y,m-1,1),last=Date.UTC(y,m,0);
  var start=first-new Date(first).getUTCDay()*864e5;
  var weeks=Math.ceil((last-start)/864e5/7+1/7);
  var cal=$("cal");cal.innerHTML="";
  for(var w=0;w<weeks;w++){
    var ws=start+w*7*864e5,we=ws+6*864e5;
    var wk=el("div","week"),days=el("div","days");
    for(var c=0;c<7;c++){
      var t=ws+c*864e5,k=iso(t),d=new Date(t);
      var b=el("button","day"+(d.getUTCMonth()!==m-1?" out":"")+(c==0||c==6?" we":"")+(k===today?" today":"")+(k===sel?" sel":""));
      b.type="button";b.appendChild(el("span","",String(d.getUTCDate())));
      b.setAttribute("aria-label",md(k)+"("+wd(k)+")");
      (function(kk){b.onclick=function(){sel=kk;renderSel();renderMonth();var c=$("selCard");if(c){var r=c.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight)c.scrollIntoView({behavior:"smooth",block:"start"})}}})(k);
      days.appendChild(b);
    }
    wk.appendChild(days);
    var segs=[];
    EV.forEach(function(ev){
      if(!matchFmt(ev))return;
      var s=D(ev.s),e=D(ev.e);
      if(e<ws||s>we)return;
      var cs=Math.max(s,ws),ce=Math.min(e,we);
      segs.push({ev:ev,a:Math.round((cs-ws)/864e5),b:Math.round((ce-ws)/864e5),cl:s<ws,cr:e>we});
    });
    segs.sort(function(x,y){return x.a-y.a||(y.b-y.a)-(x.b-x.a)||x.ev.id-y.ev.id});
    var lanes=[];
    segs.forEach(function(sg){
      var l=0;while(lanes[l]!==undefined&&lanes[l]>=sg.a)l++;
      lanes[l]=sg.b;sg.l=l;
    });
    var bars=el("div","bars");
    segs.forEach(function(sg){
      var bar=el("div","bar c"+sg.ev.c+(sg.cl?" cl":"")+(sg.cr?" cr":""));
      bar.style.gridColumn=(sg.a+1)+" / "+(sg.b+2);bar.style.gridRow=String(sg.l+1);
      bar.title=sg.ev.n+(sg.ev.done?"(実装済み)":"");
      if(sg.ev.done){var mk=el("span","mk");mk.setAttribute("aria-hidden","true");bar.appendChild(mk)}
      bar.appendChild(el("span","n",sg.ev.n));
      if(ni0(sg.ev))bar.appendChild(pic());
      (function(ev){press(bar,function(){openDetail(ev)})})(sg.ev);
      bars.appendChild(bar);
    });
    wk.appendChild(bars);cal.appendChild(wk);
  }
  var ms=iso(first),me=iso(last);
  var evs=EV.filter(function(e){return matchFmt(e)&&e.s<=me&&e.e>=ms}).sort(function(a,b){return D(a.s)-D(b.s)||D(a.e)-D(b.e)});
  $("mTitle").textContent=m+"月のイベント";
  $("mCount").textContent=evs.length+"件・実装済み "+evs.filter(function(e){return e.done}).length+"件";
  var ml=$("mList");ml.innerHTML="";
  if(!evs.length)ml.appendChild(el("div","empty","条件に合うイベントはありません。"));
  evs.forEach(function(e){ml.appendChild(item(e))});
}
var dw=$("dows");W.forEach(function(w){dw.appendChild(el("div","",w))});
$("prev").onclick=function(){var y=+ym.slice(0,4),m=+ym.slice(5)-1;if(m<1){m=12;y--}ym=y+"-"+String(m).padStart(2,"0");renderMonth()};
$("next").onclick=function(){var y=+ym.slice(0,4),m=+ym.slice(5)+1;if(m>12){m=1;y++}ym=y+"-"+String(m).padStart(2,"0");renderMonth()};
$("dClose").onclick=closeDetail;
$("lb").onclick=function(){$("lb").hidden=true};
$("ov").onclick=function(e){if(e.target===$("ov"))closeDetail()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("ov").hidden)closeDetail()});
var jEl=$("jump");
(function(){var yy=+MIN.slice(0,4),mm=+MIN.slice(5);for(;;){var v=yy+"-"+String(mm).padStart(2,"0");var o=el("option","",yy+"年"+mm+"月");o.value=v;jEl.appendChild(o);if(v===MAX)break;mm++;if(mm>12){mm=1;yy++}}})();
jEl.onchange=function(){ym=jEl.value;renderMonth()};
$("todayBtn").onclick=function(){ym=today.slice(0,7);if(ym<MIN)ym=MIN;if(ym>MAX)ym=MAX;sel=today;renderSel();renderMonth()};
$("lgPic").appendChild(pic());
function renderSearch(){
  var list=$("qList");list.innerHTML="";
  if(fmt==="all"){$("qCount").textContent="";list.appendChild(el("div","empty","形式を選ぶと、期間を問わずその形式のイベントがここに出ます。カレンダーや月のイベントも連動して絞られます。"));return}
  var hits=EV.filter(function(e){return matchFmt(e)}).sort(function(a,b){return D(a.s)-D(b.s)});
  $("qCount").textContent=hits.length+"件";
  if(!hits.length){list.appendChild(el("div","empty","その形式のイベントはありません。"));return}
  hits.forEach(function(e){list.appendChild(item(e))});
}
(function(){var seen={};EV.forEach(function(ev){var f=catOf(ev);if(seen[f])return;seen[f]=1;var o=el("option","",f);o.value=f;$("fmt").appendChild(o)})})();
$("fmt").addEventListener("change",function(){fmt=this.value;renderSearch();renderSel();renderMonth()});
renderSearch();
renderSel();renderMonth();
</script>
</body></html>
